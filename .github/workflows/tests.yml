name: Tests and portable review

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      LANDSCAPE_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev --extra browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
      - run: uv run landscape render examples/synthetic --format html
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-landscape-review
          path: examples/synthetic/generated/html/L1.0_existing_conditions.html
