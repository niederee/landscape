name: Tests and portable review

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      LANDSCAPE_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev --extra browser
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
      - run: uv run landscape render examples/synthetic --format html
      - run: uv run landscape compare examples/synthetic
      - run: uv run landscape phases examples/synthetic
      - run: uv run landscape survey examples/constraints/traverse.yaml --output examples/constraints/generated/traverse.json
      - run: uv run landscape render examples/constraints --format html
      - run: uv run landscape compare examples/constraints
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-landscape-review
          path: |
            examples/synthetic/generated/html/*.html
            examples/constraints/generated/html/*.html
            examples/constraints/generated/traverse.json
